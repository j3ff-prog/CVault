services:
  - type: web
    name: cvault
    env: python
    buildCommand: pip install -r requirements.txt && python -c "from database import init_db; init_db()"
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        value: Jeff.006760@gmail.com
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/cvault.db

disks:
  - name: cvault-data
    mountPath: /var/data
    sizeGB: 1
